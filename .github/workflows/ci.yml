name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Every step below funnels its failure into a ::error:: annotation.
      # Workflow logs need an authenticated API call to read, but annotations
      # are readable from the public API, so this is what makes a red build
      # diagnosable without downloading logs.
      - name: Environment
        run: |
          echo "node $(node --version) / npm $(npm --version) on $(uname -sm)"

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/step.log || {
            echo "::error::npm ci failed :: $(grep -iE "error|missing|not in sync|failed" /tmp/step.log | head -c 1200 | tr "\n" "⏎")"
            exit 1
          }

      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/step.log || {
            echo "::error::lint failed :: $(grep -iE "error|missing|not in sync|failed" /tmp/step.log | head -c 1200 | tr "\n" "⏎")"
            exit 1
          }

      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/step.log || {
            echo "::error::tests failed :: $(grep -iE "error|missing|not in sync|failed" /tmp/step.log | head -c 1200 | tr "\n" "⏎")"
            exit 1
          }

      - name: Check documentation
        run: |
          set -o pipefail
          npm run check:docs 2>&1 | tee /tmp/step.log || {
            echo "::error::check:docs failed :: $(grep -iE "error|missing|not in sync|failed" /tmp/step.log | head -c 1200 | tr "\n" "⏎")"
            exit 1
          }

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/step.log || {
            echo "::error::build failed :: $(grep -iE "error|missing|not in sync|failed" /tmp/step.log | head -c 1200 | tr "\n" "⏎")"
            exit 1
          }

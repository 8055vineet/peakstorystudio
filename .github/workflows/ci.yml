name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Every step below funnels its failure into a ::error:: annotation.
      # Workflow logs need an authenticated API call to read, but annotations
      # are readable from the public API, so this is what makes a red build
      # diagnosable without downloading logs.
      - name: Environment
        run: |
          echo "node $(node --version) / npm $(npm --version) on $(uname -sm)"

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/step.log || {
            echo "::error::npm ci failed :: $(grep -iE "error|missing|not in sync|failed" /tmp/step.log | head -c 1200 | tr "\n" "⏎")"
            exit 1
          }

      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/step.log || {
            echo "::error::lint failed :: $(grep -iE "error|missing|not in sync|failed" /tmp/step.log | head -c 1200 | tr "\n" "⏎")"
            exit 1
          }

      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/step.log || {
            echo "::error::tests failed :: $(grep -iE "error|missing|not in sync|failed" /tmp/step.log | head -c 1200 | tr "\n" "⏎")"
            exit 1
          }

      - name: Check documentation
        run: |
          set -o pipefail
          npm run check:docs 2>&1 | tee /tmp/step.log || {
            echo "::error::check:docs failed :: $(grep -iE "error|missing|not in sync|failed" /tmp/step.log | head -c 1200 | tr "\n" "⏎")"
            exit 1
          }

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/step.log || {
            echo "::error::build failed :: $(grep -iE "error|missing|not in sync|failed" /tmp/step.log | head -c 1200 | tr "\n" "⏎")"
            exit 1
          }

  inquiry-e2e:
    name: Inquiry end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned rather than `latest`. Both end-to-end jobs read credentials
          # out of `supabase status -o env` by field name — API_URL, ANON_KEY,
          # SERVICE_ROLE_KEY, and for the admin job STORAGE_S3_URL and
          # S3_PROTOCOL_*. A CLI release that renames any of those makes the
          # mapping silently yield empty values, and the job then fails
          # somewhere downstream that looks nothing like the real cause. This
          # is the version those field names were verified against.
          version: 2.110.0
      - name: Start Supabase
        run: supabase start || { echo "::error::supabase start failed"; exit 1; }
      - name: Serve the Edge Function
        run: |
          cp supabase/functions/.env.example supabase/functions/.env.local
          nohup npm run db:functions > /tmp/functions.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null -X OPTIONS \
              http://127.0.0.1:54321/functions/v1/submit-inquiry && exit 0
            sleep 2
          done
          echo "::error::Edge Function did not become ready in 120s"
          cat /tmp/functions.log
          exit 1
      - name: Verify a booking inquiry reaches the database
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run verify:inquiry || {
            echo "::error::A booking inquiry did not reach the database"
            cat /tmp/functions.log
            exit 1
          }

  admin-e2e:
    name: Admin end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned rather than `latest`. Both end-to-end jobs read credentials
          # out of `supabase status -o env` by field name — API_URL, ANON_KEY,
          # SERVICE_ROLE_KEY, and for the admin job STORAGE_S3_URL and
          # S3_PROTOCOL_*. A CLI release that renames any of those makes the
          # mapping silently yield empty values, and the job then fails
          # somewhere downstream that looks nothing like the real cause. This
          # is the version those field names were verified against.
          version: 2.110.0
      - name: Start Supabase
        run: supabase start || { echo "::error::supabase start failed"; exit 1; }
      - name: Create the storage bucket
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          curl -sf --max-time 10 -X POST "$API_URL/storage/v1/bucket" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"id":"media","name":"media","public":false}' || {
            echo "::error::creating the media storage bucket failed"
            exit 1
          }
      - name: Serve the Edge Functions
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          cp supabase/functions/.env.example supabase/functions/.env.local
          # sign-upload's S3_* vars: STORAGE_S3_URL/S3_PROTOCOL_* map to
          # S3_ENDPOINT/S3_REGION/S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY exactly
          # as supabase/functions/.env.example documents — see that file and
          # the Task 4 report for why S3_ENDPOINT must be the browser-reachable
          # host (STORAGE_S3_URL) rather than the container-internal one.
          sed -i "s|^S3_ENDPOINT=.*|S3_ENDPOINT=$STORAGE_S3_URL|" supabase/functions/.env.local
          sed -i "s|^S3_REGION=.*|S3_REGION=$S3_PROTOCOL_REGION|" supabase/functions/.env.local
          sed -i "s|^S3_ACCESS_KEY_ID=.*|S3_ACCESS_KEY_ID=$S3_PROTOCOL_ACCESS_KEY_ID|" supabase/functions/.env.local
          sed -i "s|^S3_SECRET_ACCESS_KEY=.*|S3_SECRET_ACCESS_KEY=$S3_PROTOCOL_ACCESS_KEY_SECRET|" supabase/functions/.env.local
          sed -i "s|^S3_BUCKET=.*|S3_BUCKET=media|" supabase/functions/.env.local
          nohup npm run db:functions > /tmp/functions.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null -X OPTIONS \
              http://127.0.0.1:54321/functions/v1/sign-upload && exit 0
            sleep 2
          done
          echo "::error::Edge Function did not become ready in 120s"
          cat /tmp/functions.log
          exit 1
      - name: Verify an admin can publish a wedding and the public site can see it
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run verify:admin || {
            echo "::error::The admin publishing pipeline did not reach the public site"
            cat /tmp/functions.log
            exit 1
          }
